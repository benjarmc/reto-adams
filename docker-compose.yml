# En Dokploy: Domains → Container Port = 3000 (no el puerto del host).
# Traefik alcanza el servicio por la red interna; no hace falta publicar puertos al host.
services:
  reto:
    build: .
    image: reto-adams:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: "3000"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - reto-data:/data

volumes:
  reto-data:
