# Para probar la imagen en tu máquina:  docker compose up --build
# En Dokploy lo más simple es crear una "Application" con este Dockerfile (ver README).
services:
  reto:
    build: .
    image: reto-adams:latest
    restart: unless-stopped
    ports:
      # Puerto del host. Dentro del contenedor siempre es 3000.
      # En .env: HOST_PORT=3100 (o PORT=3100). Preferimos HOST_PORT.
      - "${HOST_PORT:-${PORT:-3000}}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - reto-data:/data

volumes:
  reto-data:
