# Para probar la imagen en tu máquina:  docker compose up --build
# En Dokploy lo más simple es crear una "Application" con este Dockerfile (ver README).
services:
  reto:
    build: .
    image: reto-adams:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - reto-data:/data

volumes:
  reto-data:
