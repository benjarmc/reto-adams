<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Resultados en celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0F1222}a:hover{color:#2F5BFF}
.bar-fill{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.podium-col{transition:height .6s cubic-bezier(.2,.8,.2,1)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F3F7; color: #0F1222; font-family: Geist, Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #0F1222; color: #FFFFFF; padding: 28px 20px 0; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'Bricolage Grotesque', Geist, sans-serif; font-weight: 800; font-size: 18px">Reto de Cambio</span>
      <span style="font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #FF5B2E; color: #1B0A03">Ejemplo</span>
    </div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Geist, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -0.02em">¿Quién avanzó más?</h1>
    <div role="tablist" aria-label="Ranking" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #232740; border-radius: 12px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{m.selected}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 10px; padding-top: 8px">
      <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 46px; height: 46px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; font-family: 'Bricolage Grotesque', Geist, sans-serif; color: #0F1222; {{p.avatarStyle}}">{{p.ini}}</div>
          <div style="font-weight: 600; font-size: 14px">{{p.n}}</div>
          <div style="font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 18px">{{p.v}}</div>
          <div class="podium-col" style="width: 100%; border-radius: 12px 12px 0 0; display: flex; justify-content: center; padding-top: 8px; font-family: 'Bricolage Grotesque', Geist, sans-serif; font-weight: 800; font-size: 24px; {{p.colStyle}}">{{p.pos}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 18px 16px 0; display: flex; justify-content: space-between; align-items: baseline">
    <h2 style="margin: 0; font-family: 'Bricolage Grotesque', Geist, sans-serif; font-size: 18px; font-weight: 700">Todos</h2>
    <span style="font-size: 13px; color: #5B6175">Toca a una persona</span>
  </div>

  <ol style="list-style: none; margin: 0; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <li>
        <a href="{{r.href}}" style="text-decoration: none; color: #0F1222; background: #FFFFFF; border: 1px solid #E3E5EC; border-radius: 16px; padding: 12px; display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 44px">
          <span style="font-family: 'Geist Mono', monospace; font-weight: 600; color: #5B6175; text-align: center">{{r.pos}}</span>
          <span style="width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-weight: 700; font-size: 14px; {{r.avatarStyle}}">{{r.ini}}</span>
          <span style="min-width: 0; display: flex; flex-direction: column; gap: 5px">
            <span style="font-weight: 600">{{r.n}} <span style="font-size: 12px; font-weight: 500; color: #5B6175">{{r.obj}}</span></span>
            <span style="height: 6px; border-radius: 999px; background: #EEF0F5; overflow: hidden; display: block">
              <span class="bar-fill" style="display: block; height: 100%; border-radius: 999px; {{r.barStyle}}"></span>
            </span>
          </span>
          <span style="font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums">{{r.v}}</span>
        </a>
      </li>
    </sc-for>
  </ol>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'kilos' };
  }
  renderVals() {
    var people = {
      Rosela: { ini: 'RO', bg: '#FFD9CC', obj: '↓ bajar' },
      Benja: { ini: 'BE', bg: '#D6E0FF', obj: '↓ bajar' },
      Mau: { ini: 'MA', bg: '#CDEFE3', obj: '↑ subir' },
      Lupita: { ini: 'LU', bg: '#F6E1FF', obj: '= mantener' },
      Chuy: { ini: 'CH', bg: '#FFF0C2', obj: '↓ bajar' }
    };
    var data = {
      kilos: { label: 'Kilos', list: [['Chuy', '+4.0', 4.0], ['Benja', '+3.4', 3.4], ['Rosela', '+2.2', 2.2], ['Mau', '+2.2', 2.2], ['Lupita', '0.0', 0]] },
      pct: { label: '% cambio', list: [['Benja', '+3.7%', 3.68], ['Mau', '+3.6%', 3.61], ['Chuy', '+3.4%', 3.39], ['Rosela', '+3.2%', 3.24], ['Lupita', '0.0%', 0]] },
      meta: { label: 'Meta', list: [['Lupita', '100%', 100], ['Mau', '73%', 73], ['Benja', '68%', 68], ['Rosela', '55%', 55], ['Chuy', '50%', 50]] }
    };
    var self = this;
    var mode = this.state.mode;
    var cur = data[mode];
    var max = Math.max.apply(null, cur.list.map(function (x) { return x[2]; })) || 1;
    var base = 'border: 0; cursor: pointer; font: 600 14px Geist, system-ui, sans-serif; padding: 8px 6px; border-radius: 9px; min-height: 44px; ';
    var modes = ['kilos', 'pct', 'meta'].map(function (k) {
      var on = k === mode;
      return {
        label: data[k].label,
        selected: on ? 'true' : 'false',
        style: base + (on ? 'background:#FFFFFF;color:#0F1222' : 'background:transparent;color:#C9CDDC'),
        pick: function () { self.setState({ mode: k }); }
      };
    });
    var rows = cur.list.map(function (x, i) {
      var p = people[x[0]];
      return {
        pos: i + 1, n: x[0], v: x[1], ini: p.ini, obj: p.obj,
        href: x[0] === 'Benja' ? 'Persona.dc.html' : '#',
        avatarStyle: 'background:' + p.bg,
        barStyle: 'width:' + Math.max(3, Math.round((x[2] / max) * 100)) + '%;background:' + (i === 0 ? '#FF5B2E' : '#2F5BFF')
      };
    });
    var cols = [
      { i: 1, h: 64, s: 'background:#2F5BFF;color:#FFFFFF' },
      { i: 0, h: 92, s: 'background:#FF5B2E;color:#1B0A03' },
      { i: 2, h: 48, s: 'background:#3A3F5C;color:#FFFFFF' }
    ];
    var podium = cols.map(function (c) {
      var r = rows[c.i];
      return {
        n: r.n, v: r.v, ini: r.ini, pos: c.i + 1,
        avatarStyle: 'background:' + people[r.n].bg + (c.i === 0 ? ';box-shadow:0 0 0 3px #0F1222, 0 0 0 5px #FF5B2E' : ''),
        colStyle: 'height:' + c.h + 'px;' + c.s
      };
    });
    return { modes: modes, rows: rows, podium: podium };
  }
}
</script>
</body>
</html>
